  <text x="600" y="565" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#a8c9b5" text-anchor="middle" letter-spacing="4">PRIME REAL ESTATE ACROSS NIGERIA</text>
