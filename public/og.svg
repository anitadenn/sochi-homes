      <stop offset="0" stop-color="#155244"/>
      <stop offset="0.55" stop-color="#1f6f5c"/>
      <stop offset="1" stop-color="#12251e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#a8c9b5" stop-opacity="0.35"/>
